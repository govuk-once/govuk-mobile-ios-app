name: Unit Test

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-unit
  cancel-in-progress: true

jobs:
  build:
    name: Unit test
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin@v6.0.3
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # pin@v1.342.0
        with:
          bundler-cache: true

      - name: Select xcode
        run: xcodes select

      - name: Boot simulator in background
        run: |
          device=$(ruby -ryaml -e 'puts YAML.load_file("Fastlane/.build.yml", aliases: true)["unit"]["scan"]["devices"].first')
          name="${device% (*}"
          os="${device##*(}"
          os="${os%)}"
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e 'name, os = ARGV; devices = JSON.parse(STDIN.read)["devices"]; runtime = devices.keys.find { |r| r.end_with?("iOS-#{os.tr(".", "-")}") }; device = (devices[runtime] || []).find { |d| d["name"] == name }; puts device ? device["udid"] : ""' "$name" "$os")
          echo "Booting $device ($udid)"
          if [ -n "$udid" ]; then
            nohup xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/simulator_boot.log" 2>&1 &
          fi

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: build_for_unit_testing/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('GovUK.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: build_for_unit_testing/CompilationCache.noindex
          key: compilation-${{ runner.os }}-${{ hashFiles('GovUK.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: compilation-${{ runner.os }}-

      - name: Unit tests
        run: bundle exec fastlane unit

      - name: Archive failure diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: FailureDiffs
          path: FailureDiffs
          retention-days: 1

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: BuildLogs
          path: |
            build_for_unit_testing/Logs/Build
            ~/Library/Logs/scan
          retention-days: 1

      - name: Save code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: test-output
          path: test_output
